name: Update prices and deploy

on:
  push:
    branches: [main]
  schedule:
    # 07:00 and 19:00 WIB (UTC+7) = 00:00 and 12:00 UTC.
    # ~50 credits per run for every active coin → ~3,000 of the free plan's 10,000 credits a month.
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scheduled and manual runs fetch fresh data from CoinMarketCap.
      # A push only changes the site, so it reuses the data already live and spends no credits.
      - name: Get CoinMarketCap data
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          MODE: ${{ github.event_name == 'push' && 'reuse' || 'fetch' }}
        run: python scripts/update_prices.py "$MODE"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
