name: Update prices and deploy

on:
  push:
    branches: [main]
  schedule:
    # Top 500, every hour: 3 credits a run, ~2,200 a month.
    - cron: "5 * * * *"
    # Every active coin, 07:00 and 19:00 WIB (00:00 and 12:00 UTC): ~50 credits a run, ~3,000 a month.
    # This run also refreshes the top 500 from the same data, at no extra cost.
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to fetch"
        type: choice
        default: all
        options: [all, top500, reuse]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # push -> reuse the live data (no credits); 00:00 and 12:00 UTC -> every coin; otherwise the top 500.
      - name: Get CoinMarketCap data
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          MODE: ${{ inputs.mode || (github.event_name == 'push' && 'reuse') || (github.event.schedule == '0 0,12 * * *' && 'all') || 'top500' }}
        run: |
          echo "Mode: $MODE"
          python scripts/update_prices.py "$MODE"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
